<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="500" height="500">
  <!-- Clean white background -->
  <rect width="500" height="500" fill="#FFFFFF" />

  <!-- EMBLEM -->
  <g id="tatva-emblem">
    <!-- Orange foundation house -->
    <polygon 
      points="170,246 170,196 201,175 232,196 232,246" 
      fill="#DE5826" 
    />

    <!-- Outer Navy gable roof & right wall -->
    <path 
      d="M 170,160 L 170,114 L 250,68 L 330,114 L 330,246" 
      fill="none" 
      stroke="#0B2540" 
      stroke-width="16.5" 
      stroke-linejoin="miter" 
      stroke-miterlimit="4" 
      stroke-linecap="square" 
    />

    <!-- Interlocking Navy structural S ribbon -->
    <path 
      d="M 198,126 L 250,96 L 302,126 L 302,172 L 246,203 L 246,246 L 330,246" 
      fill="none" 
      stroke="#0B2540" 
      stroke-width="16.5" 
      stroke-linejoin="miter" 
      stroke-miterlimit="4" 
      stroke-linecap="square" 
    />
  </g>

  <!-- TYPOGRAPHY -->
  <g text-anchor="middle" font-family="Montserrat, -apple-system, sans-serif">
    <!-- TATVA in heavy bold uppercase -->
    <text x="250" y="296" font-size="52" font-weight="800" fill="#0B2540" letter-spacing="4px">TATVA</text>
    
    <!-- STRUCTURA in tracked uppercase -->
    <text x="252" y="332" font-size="18.5" font-weight="700" fill="#0B2540" letter-spacing="6.8px">STRUCTURA</text>
  </g>
</svg>