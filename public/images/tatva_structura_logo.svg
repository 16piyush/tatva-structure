<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="500" height="500">
  <!-- Clean white background card matching screenshot -->
  <rect width="500" height="500" fill="#FFFFFF" />

  <!-- EMBLEM -->
  <g id="tatva-emblem">
    <!-- 1. ORANGE FOUNDATION HOUSE (Solid terracotta orange at bottom left) -->
    <polygon 
      points="173,225 173,184 202.5,166 232,184 232,225" 
      fill="#DE5826" 
    />

    <!-- 2. OUTER NAVY GABLE ROOF & RIGHT WALL (Stroke-based for exact uniform width) -->
    <path 
      d="
        M 181.25,152
        L 181.25,119.5
        L 250,76.5
        L 318.75,119.5
        L 318.75,216.75
      " 
      fill="none" 
      stroke="#0C2340" 
      stroke-width="16.5" 
      stroke-linejoin="miter" 
      stroke-miterlimit="4" 
      stroke-linecap="square" 
    />

    <!-- 3. INTERLOCKING NAVY STRUCTURAL "S" RIBBON -->
    <path 
      d="
        M 205,134.5
        L 250,106
        L 289.5,131
        L 289.5,166
        L 248.5,191.5
        L 248.5,216.75
        L 318.75,216.75
      " 
      fill="none" 
      stroke="#0C2340" 
      stroke-width="16.5" 
      stroke-linejoin="miter" 
      stroke-miterlimit="4" 
      stroke-linecap="square" 
    />
  </g>

  <!-- TYPOGRAPHY -->
  <g text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, Arial, Montserrat, Helvetica, sans-serif">
    <!-- TATVA in heavy bold navy uppercase -->
    <text x="250" y="286" font-size="52" font-weight="900" fill="#0C2340" letter-spacing="4px">TATVA</text>
    
    <!-- STRUCTURA in tracking slate uppercase -->
    <text x="252" y="322" font-size="19" font-weight="700" fill="#4B5868" letter-spacing="6.8px">STRUCTURA</text>
  </g>
</svg>